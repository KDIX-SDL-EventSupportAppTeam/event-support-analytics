# 読み取り専用の口を、さくらへ渡す前にローカルで通しきるための一式。
#
#   python deploy/sakura-readonly-proxy/verify/verify.py
#
# 本番のさくらには触らない。ここで作るのは使い捨ての MySQL と PHP だけ。
# MySQL の設定（文字コード・UTC）は event-support-server/docker-compose.yml に合わせてある。

name: readonly-proxy-verify

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: verifyroot
      MYSQL_DATABASE: event_support_verify
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pverifyroot || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  php:
    build: .
    # さくらと同じく「PHP から見て MySQL はローカル」の形にはできないので、
    # config.php の db_host だけがローカル検証用に mysql を指す。
    volumes:
      - ../index.php:/opt/proxy/index.php:ro
      - ./config.verify.php:/opt/proxy/config.php:ro
    ports:
      - "18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    # 読み取り専用マウントのままだと PHP から見える置き場を作れないので、
    # 起動時に書き込み可能な場所へ写してから配信する（検証用の都合）。
    command: sh -c "mkdir -p /srv/www && cp /opt/proxy/index.php /opt/proxy/config.php /srv/www/ && php -S 0.0.0.0:8080 -t /srv/www"
